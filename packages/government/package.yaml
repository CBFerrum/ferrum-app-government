package: government
version: 0.1.0
label: Government
description: "Permits applied for, reviewed, paid through ERP and issued with their expiry, cases with deadlines, and a citizens' portal"
depends: [core, selling, accounting]

modules:
  - name: government
    label: Government
    icon: landmark
    order: 55
    items: [PermitApplication, Permit, PublicCase, PermitType, CaseCategory, GovernmentSettings]

roles:
  - name: Permit Officer
    description: Reviews permit applications, approves or rejects them, and issues and revokes permits.
    permissions:
      - {entity: PermitType, read: true}
      - {entity: PermitApplication, read: true, write: true, create: true, export: true}
      - {entity: Permit, read: true, write: true, export: true}
      - {entity: SalesInvoice, read: true}
  - name: Case Officer
    description: Works citizens' cases to their resolution.
    permissions:
      - {entity: CaseCategory, read: true}
      - {entity: PublicCase, read: true, write: true, create: true, export: true}
  - name: Services Manager
    description: Sets up permit types, their fees and documents, case categories and the settings.
    permissions:
      - {entity: GovernmentSettings, read: true, write: true, create: true}
      - {entity: PermitType, read: true, write: true, create: true}
      - {entity: CaseCategory, read: true, write: true, create: true}
      - {entity: PermitApplication, read: true}
      - {entity: Permit, read: true}
      - {entity: PublicCase, read: true}
      - {entity: Item, read: true}
      - {entity: Company, read: true}
