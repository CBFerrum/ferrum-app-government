package: government
version: 0.1.0
label: Government
description: "Permits applied for, reviewed, paid through ERP and issued with their expiry, cases with deadlines, and a citizens' portal"
depends: [core, selling, accounting]

modules:
  - name: government
    label: Government
    icon: landmark
    order: 55
    items: [PermitApplication, Permit, PublicCase, PermitType, CaseCategory, GovernmentSettings]

roles:
  - name: Permit Officer
    description: Reviews permit applications, approves or rejects them, and issues and revokes permits.
    permissions:
      - {entity: PermitType, read: true}
      - {entity: PermitApplication, read: true, write: true, create: true, export: true}
      - {entity: Permit, read: true, write: true, export: true}
      - {entity: SalesInvoice, read: true}
  - name: Case Officer
    description: Works citizens' cases to their resolution.
    permissions:
      - {entity: CaseCategory, read: true}
      - {entity: PublicCase, read: true, write: true, create: true, export: true}
  - name: Services Manager
    description: Sets up permit types, their fees and documents, case categories and the settings.
    permissions:
      - {entity: GovernmentSettings, read: true, write: true, create: true}
      - {entity: PermitType, read: true, write: true, create: true}
      - {entity: CaseCategory, read: true, write: true, create: true}
      - {entity: PermitApplication, read: true}
      - {entity: Permit, read: true}
      - {entity: PublicCase, read: true}
      - {entity: Item, read: true}
      - {entity: Company, read: true}

personal_data:
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Draft}, erase: [applicant_name, applicant_email, details, documents]}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Withdrawn}, erase: [applicant_name, applicant_email, details, documents]}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Submitted}, retain: "An application put to the office, and its decision, are public records"}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Under Review}, retain: "An application put to the office, and its decision, are public records"}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Approved}, retain: "An application put to the office, and its decision, are public records"}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Rejected}, retain: "An application put to the office, and its decision, are public records"}
  - {entity: PermitApplication, match: applicant_email, name: applicant_name, where: {status: Issued}, retain: "An application put to the office, and its decision, are public records"}
  - {entity: Permit, match: holder_email, name: holder_name, retain: "Permits issued are public records"}
  - {entity: PublicCase, match: citizen_email, name: citizen_name, retain: "Case records, kept as public records law requires"}
