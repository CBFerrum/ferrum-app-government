id: government
name: Government
version: 0.2.13
publisher: cbferrum
summary: "Permits applied for, reviewed in stages, paid through ERP, issued on conditions and renewed, a public register, cases with deadlines, and a citizens' portal"
description: README.md
categories: [industry, support]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-government
support: https://github.com/CBFerrum/ferrum-app-government/issues
runtime: native
platform: ">=0.3.2, <0.4"
# Fees are invoiced through ERP: installing it installs ERP.
requires: {erp: ">=0.1"}
packages: [government]
uninstall: ask
# Its own interface at /government/: the officers' queues; and the portal's "Your services".
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: government
      route: government
      title: Government
      description: Permits, applications and citizens' cases
      icon: landmark
      color: "#4338ca"
      roles: [Permit Officer, Case Officer, Services Manager]
  shell.open:
    - {id: government, package: government, path: "government/e/{entity}/{id}", list: "government/e/{entity}"}
  shell.create:
    - {id: application, label: Permit Application, path: government/e/PermitApplication/new, entity: PermitApplication}
    - {id: case, label: Case, path: government/e/PublicCase/new, entity: PublicCase}
  # The workspace's portal: a citizen's applications, permits and cases at /portal/services/.
  shell.portal:
    - {id: services, title: Your services, description: "Apply for permits, follow your applications, renew permits, and raise cases"}
  # Applicants told as their application moves, and holders when a permit may be renewed.
  shell.notification:
    - {id: application, label: Your applications and permits, default: [email, inapp]}
  # What the assistant should know in Government's pages, and what it suggests asking there.
  shell.assistant:
    - id: government
      title: "Government"
      instructions: >-
        A PermitApplication goes Draft, Submitted, Under Review (through its permit type's stages), then Approved,
        Rejected, Issued or Withdrawn; its fees are paid through ERP. An issued Permit is Valid until it Expires or is
        Revoked, and is on the public register. A PublicCase (Open, In Progress, Resolved, Closed) has deadlines set
        by its category.
      suggestions:
        - "Which applications wait for review, oldest first?"
        - "Which permits expire next month?"
        - "Which cases are past their deadline?"
